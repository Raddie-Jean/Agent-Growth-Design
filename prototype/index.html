<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open Design · 原型成长计划（迁移提案）</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eeee;color:#202522;font:16px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}aside{width:230px;padding:28px;position:fixed;height:100vh}aside h3{margin:24px 0}aside p{padding:12px;border-radius:12px;color:#626b68}aside p:first-of-type{background:#d7e0dc;color:#202522}main{margin:18px 18px 18px 230px;background:#fafcfb;border-radius:24px;min-height:96vh;padding:38px 48px}small{color:#63746b}.top{display:flex;justify-content:space-between;align-items:center}button{border:0;background:#153c2d;color:white;border-radius:12px;padding:14px 22px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:default}.light{background:#e6eee9;color:#234638}.green{background:#18ef00;color:#142711}.hero{margin:50px 0 26px}.hero h1{font-size:38px;letter-spacing:-1px}.card{background:white;border:1px solid #dce4df;border-radius:18px;padding:26px;margin:16px 0}.banner{background:#e5f8df;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.num{font-size:32px;font-weight:650}nav{display:flex;gap:8px;margin-top:24px}nav button{padding:10px 14px}.task{display:flex;align-items:center;justify-content:space-between;gap:18px}.pill{background:#e7f4e3;padding:6px 12px;border-radius:20px;font-size:13px}textarea{width:100%;min-height:110px;padding:18px;border:1px solid #dbe5dd;border-radius:14px;font:inherit}footer{font-size:13px;color:#68756c;margin-top:30px}.status{color:#27774b}a{color:#247243}@media(max-width:900px){aside{display:none}main{margin:12px;padding:24px}.grid{grid-template-columns:1fr}}</style><aside><b>◈ Open Design</b><h3>设计工作空间</h3><p>⌂　首页</p><p>◎　社区</p><hr><p>▱　全部项目</p><p>◈　设计体系</p><p>⊞　插件</p><p>⚙　设置</p><small>迁移测试 · 截图重建壳层<br>非官方活动</small></aside><main><div class="top"><small>WORKSPACE / GROWTH LAB</small><span class="pill">活动提案 · 未接入付费额度</span></div><nav id="tabs"></nav><section id="screen"></section><footer>学习积分是新增活动提案，不可兑换或抵扣现有付费额度。额度、成本与接口待验证。本预览仅本地模拟，未接入真实模型与发奖服务。</footer></main><script>
const names=['首页入口','任务包','执行与验收','积分任务','结算与复用'];let view=0,day=1,accepted=false;let claimed=new Set(),completed=new Set(),balance=0;const points=[100,200,300],tasks=['生成首个可用原型','按反馈修改原型','保存模板并复用'];function go(i){view=i;render()}function render(){tabs.innerHTML=names.map((x,i)=>`<button class="${view===i?'':'light'}" onclick="go(${i})">${i+1}. ${x}</button>`).join('');let content='';if(view===0)content=`<div class="hero"><h1>让我们创建更好的原型</h1><p>从一个真实目标开始，把想法做成可检查的作品。</p></div><div class="card"><textarea placeholder="描述你想制作的原型…"></textarea><button class="green" onclick="go(2)">创建原型 ↑</button></div><div class="card banner"><div><small>新增活动入口</small><h2>原型成长计划</h2><p>3次真实练习，累计600学习积分；把方法保存下来。</p></div><button onclick="go(1)">查看成长任务 →</button></div>`;if(view===1)content=`<div class="hero"><small>选择你的任务包</small><h1>从想法到可复用原型</h1><p>选任务不是领取奖励，完成并验收后才能领取对应积分。</p></div><div class="grid">${tasks.map((t,i)=>`<div class="card"><small>DAY 0${i+1}</small><h2>${t}</h2><p>以实际产物为依据，检查内容、结构与下一步行动。</p><div class="num">${points[i]} 分</div></div>`).join('')}</div><button onclick="go(2)">开始今天的任务</button>`;if(view===2)content=`<div class="hero"><small>DAY ${day} / ${tasks[day-1]}</small><h1>先验收成果，再领取积分</h1></div><div class="card"><h2>原型生成 · 模拟执行</h2><p>输入材料 → 生成页面 → 检查文字与主行动 → 用户确认</p><p class="status" id="runstate">等待用户确认成果是否可用</p><button onclick="accepted=true;completed.add(day-1);go(3)">确认成果可用</button> <button class="light" onclick="document.getElementById('runstate').textContent='重试完成，请重新检查成果（不会发奖）'">生成失败 / 重试</button></div>`;if(view===3)content=`<div class="hero"><small>今天的进度</small><h1>每一次有效使用，都看得见</h1><p>已到账 <b>${balance}</b> / 可获上限600学习积分</p></div>${tasks.map((t,i)=>`<div class="card task"><div><small>DAY ${i+1}</small><h2>${t}</h2><span>+${points[i]} 积分　${claimed.has(i)?'已到账':day<i+1?'尚未解锁':completed.has(i)?'可领取':'待验收'}</span></div><button ${claimed.has(i)||day<i+1||!completed.has(i)?'disabled':''} onclick="claim(${i})">${claimed.has(i)?'已领取':'领取积分'}</button></div>`).join('')}<button class="light" onclick="nextDay()">模拟次日解锁</button> <button onclick="go(4)">查看结算</button>`;if(view===4)content=`<div class="hero"><small>周期结算</small><h1>积分是反馈，作品才是积累</h1></div><div class="card banner"><div><h2>${claimed.size===3?'已完成本轮成长':'本轮仍在进行'}</h2><div class="num">${balance} 学习积分</div><p>结算仅汇总已到账积分，不重复发奖。</p></div><button onclick="go(3)">返回任务</button></div><div class="card"><h2>把这次方法带到下一次</h2><p>保存目标、输入与验收清单，开始新的原型。</p><button ${claimed.size<3?'disabled':''} onclick="this.textContent='已保存模板（本地模拟）'">保存模板</button> <button class="light" onclick="go(0)">回到工作区</button></div>`;screen.innerHTML=content}function claim(i){if(day<i+1||!completed.has(i)||claimed.has(i))return;claimed.add(i);balance+=points[i];render()}function nextDay(){day=Math.min(3,day+1);accepted=false;go(2)}render();</script></html>
